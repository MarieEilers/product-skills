<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1088" viewBox="0 0 1200 1088" role="img" aria-label="Chat with the Product Coach in the Claude app: real session with a fictional case, shortened, translated from German.">
  <style>
    .du { font: 400 18px -apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #1F1E1D; }
    .claude { font: 400 19px Georgia, 'Iowan Old Style', 'Times New Roman', serif; fill: #1F1E1D; }
    .label { font: 400 12px ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; fill: #B4583A; letter-spacing: .8px; }
    .denkt { font: 400 14px ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; fill: #9A968B; opacity: 0; animation: denk 1.3s linear forwards; }
    @keyframes denk { 0% { opacity: 0; } 12% { opacity: 1; } 85% { opacity: 1; } 100% { opacity: 0; } }
    .b { animation: ein .45s ease backwards; }
    @keyframes ein { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .nur-animiert { display: none; } .nur-statisch { display: inline; } }
  </style>
  <rect x="1" y="1" width="1198" height="1086" rx="16" fill="#FAF9F5" stroke="#E4E2DA" stroke-width="2"/>
  <path d="M1 17 A16 16 0 0 1 17 1 H1183 A16 16 0 0 1 1199 17 V52 H1 Z" fill="#F0EEE6"/>
  <circle cx="30" cy="27" r="7" fill="#E5645B"/><circle cx="54" cy="27" r="7" fill="#E7C37E"/><circle cx="78" cy="27" r="7" fill="#7FB685"/>
  <text x="108" y="32" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" letter-spacing="1.2" fill="#7A776E">CLAUDE · CHAT</text>
  <text x="1170" y="32" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" letter-spacing="1.2" fill="#7A776E" text-anchor="end">REAL SESSION · FICTIONAL CASE · SHORTENED · TRANSLATED</text>
  <g class="b" style="animation-delay:0.60s"><rect x="412" y="102" width="740" height="107" rx="16" fill="#ECE9DF"/><text x="432" y="138" class="du">Coach me on a situation. Management went straight to the team. They're now</text><text x="432" y="165" class="du">building the export that sales promised a key account by March. Our</text><text x="432" y="192" class="du">customer priority #1 is on hold.</text></g><text class="denkt" x="48" y="249" style="animation-delay:1.60s"><tspan fill="#B4583A">✳</tspan> thinking …</text><text class="b label" x="48" y="249" style="animation-delay:2.90s">✳ CLAUDE</text><g class="b" style="animation-delay:2.90s"><text x="48" y="291" class="claude"><tspan font-weight="700">You're </tspan><tspan font-weight="700">naming </tspan><tspan font-weight="700">a </tspan><tspan font-weight="700">solution, </tspan><tspan font-weight="700">not </tspan><tspan font-weight="700">a </tspan><tspan font-weight="700">problem. </tspan>What problem does the key account want the export to solve? Does</text><text x="48" y="321" class="claude">anyone on the team know?</text></g><g class="b" style="animation-delay:3.80s"><text x="48" y="369" class="claude"><tspan font-weight="700">“On </tspan><tspan font-weight="700">hold” </tspan><tspan font-weight="700">is </tspan><tspan font-weight="700">an </tspan><tspan font-weight="700">assumption. </tspan>Did anyone decide that you can only do one of the two? Or did it just happen</text><text x="48" y="399" class="claude">because nobody decided?</text></g><g class="b" style="animation-delay:4.70s"><text x="48" y="447" class="claude">What did you promise the five pilot farm shops for November – and does anyone in management know about that</text><text x="48" y="477" class="claude">promise?</text></g><g class="b" style="animation-delay:5.60s"><rect x="412" y="513" width="740" height="80" rx="16" fill="#ECE9DF"/><text x="432" y="549" class="du">A start in November. Management doesn't know. I never presented the</text><text x="432" y="576" class="du">customer priority with numbers.</text></g><text class="denkt" x="48" y="633" style="animation-delay:6.60s"><tspan fill="#B4583A">✳</tspan> thinking …</text><text class="b label" x="48" y="633" style="animation-delay:7.90s">✳ CLAUDE</text><g class="b" style="animation-delay:7.90s"><text x="48" y="675" class="claude"><tspan font-weight="700">Management </tspan><tspan font-weight="700">didn't </tspan><tspan font-weight="700">override </tspan><tspan font-weight="700">your </tspan><tspan font-weight="700">priority. </tspan><tspan font-weight="700">From </tspan><tspan font-weight="700">their </tspan><tspan font-weight="700">point </tspan><tspan font-weight="700">of </tspan><tspan font-weight="700">view, </tspan><tspan font-weight="700">it </tspan><tspan font-weight="700">didn't </tspan><tspan font-weight="700">exist. </tspan>You both made promises</text><text x="48" y="705" class="claude">to the outside without aligning internally. Sales just got to the team faster.</text></g><g class="b" style="animation-delay:8.80s"><rect x="412" y="741" width="740" height="53" rx="16" fill="#ECE9DF"/><text x="432" y="777" class="du">Ouch. What do I do by Friday – concretely?</text></g><text class="denkt" x="48" y="834" style="animation-delay:9.80s"><tspan fill="#B4583A">✳</tspan> thinking …</text><text class="b label" x="48" y="834" style="animation-delay:11.10s">✳ CLAUDE</text><g class="b" style="animation-delay:11.10s"><text x="48" y="876" class="claude"><tspan font-weight="700">Monday: </tspan>understand the export. Go to sales first, not to management.</text></g><g class="b" style="animation-delay:12.00s"><text x="48" y="924" class="claude"><tspan font-weight="700">By </tspan><tspan font-weight="700">Wednesday: </tspan>turn the quotes into evidence. Quotes can be counted.</text></g><g class="b" style="animation-delay:12.90s"><text x="48" y="972" class="claude"><tspan font-weight="700">Friday: </tspan>meeting with management. Ask for a decision instead of complaining – with two or three options.</text></g>
  <rect x="30" y="1026" width="1140" height="44" rx="12" fill="#FFFFFF" stroke="#DEDBD0"/>
  <text x="50" y="1054" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" fill="#A8A498">Reply to Claude …</text>
</svg>
