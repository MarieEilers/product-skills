<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1088" viewBox="0 0 1200 1088" role="img" aria-label="Chat mit dem Product Coach in der Claude-App: echte Sitzung mit erfundenem Fall, gekürzt.">
  <style>
    .du { font: 400 18px -apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #1F1E1D; }
    .claude { font: 400 19px Georgia, 'Iowan Old Style', 'Times New Roman', serif; fill: #1F1E1D; }
    .label { font: 400 12px ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; fill: #B4583A; letter-spacing: .8px; }
    .denkt { font: 400 14px ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; fill: #9A968B; opacity: 0; animation: denk 1.3s linear forwards; }
    @keyframes denk { 0% { opacity: 0; } 12% { opacity: 1; } 85% { opacity: 1; } 100% { opacity: 0; } }
    .b { animation: ein .45s ease backwards; }
    @keyframes ein { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .nur-animiert { display: none; } .nur-statisch { display: inline; } }
  </style>
  <rect x="1" y="1" width="1198" height="1086" rx="16" fill="#FAF9F5" stroke="#E4E2DA" stroke-width="2"/>
  <path d="M1 17 A16 16 0 0 1 17 1 H1183 A16 16 0 0 1 1199 17 V52 H1 Z" fill="#F0EEE6"/>
  <circle cx="30" cy="27" r="7" fill="#E5645B"/><circle cx="54" cy="27" r="7" fill="#E7C37E"/><circle cx="78" cy="27" r="7" fill="#7FB685"/>
  <text x="108" y="32" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" letter-spacing="1.2" fill="#7A776E">CLAUDE · CHAT</text>
  <text x="1170" y="32" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" letter-spacing="1.2" fill="#7A776E" text-anchor="end">ECHTE SITZUNG · ERFUNDENER FALL · GEKÜRZT</text>
  <g class="b" style="animation-delay:0.60s"><rect x="412" y="102" width="740" height="107" rx="16" fill="#ECE9DF"/><text x="432" y="138" class="du">Coach mich auf eine Situation. Das Management war direkt beim Team. Die</text><text x="432" y="165" class="du">bauen jetzt den Export, den der Vertrieb einem Großkunden bis März</text><text x="432" y="192" class="du">versprochen hat. Unsere Kundenprio #1 liegt damit auf Eis.</text></g><text class="denkt" x="48" y="249" style="animation-delay:1.60s"><tspan fill="#B4583A">✳</tspan> denkt nach …</text><text class="b label" x="48" y="249" style="animation-delay:2.90s">✳ CLAUDE</text><g class="b" style="animation-delay:2.90s"><text x="48" y="291" class="claude"><tspan font-weight="700">Du </tspan><tspan font-weight="700">nennst </tspan><tspan font-weight="700">eine </tspan><tspan font-weight="700">Lösung, </tspan><tspan font-weight="700">aber </tspan><tspan font-weight="700">kein </tspan><tspan font-weight="700">Problem. </tspan>Welches Problem hat der Großkunde, das der Export lösen soll? Weiß</text><text x="48" y="321" class="claude">das im Team jemand?</text></g><g class="b" style="animation-delay:3.80s"><text x="48" y="369" class="claude"><tspan font-weight="700">„Liegt </tspan><tspan font-weight="700">auf </tspan><tspan font-weight="700">Eis“ </tspan><tspan font-weight="700">ist </tspan><tspan font-weight="700">eine </tspan><tspan font-weight="700">Annahme. </tspan>Hat jemand entschieden, dass ihr nur eines von beiden machen könnt? Oder</text><text x="48" y="399" class="claude">ist das so gekommen, weil niemand entschieden hat?</text></g><g class="b" style="animation-delay:4.70s"><text x="48" y="447" class="claude">Was hast du den fünf Pilot-Hofläden für November zugesagt – und weiß im Management jemand von dieser Zusage?</text></g><g class="b" style="animation-delay:5.60s"><rect x="412" y="483" width="740" height="80" rx="16" fill="#ECE9DF"/><text x="432" y="519" class="du">Den Start im November. Das Management weiß davon nichts. Ich habe die</text><text x="432" y="546" class="du">Kundenprio nie mit Zahlen vorgestellt.</text></g><text class="denkt" x="48" y="603" style="animation-delay:6.60s"><tspan fill="#B4583A">✳</tspan> denkt nach …</text><text class="b label" x="48" y="603" style="animation-delay:7.90s">✳ CLAUDE</text><g class="b" style="animation-delay:7.90s"><text x="48" y="645" class="claude"><tspan font-weight="700">Das </tspan><tspan font-weight="700">Management </tspan><tspan font-weight="700">hat </tspan><tspan font-weight="700">deine </tspan><tspan font-weight="700">Priorität </tspan><tspan font-weight="700">nicht </tspan><tspan font-weight="700">übergangen. </tspan><tspan font-weight="700">Aus </tspan><tspan font-weight="700">seiner </tspan><tspan font-weight="700">Sicht </tspan><tspan font-weight="700">gab </tspan><tspan font-weight="700">es </tspan><tspan font-weight="700">sie </tspan><tspan font-weight="700">gar </tspan><tspan font-weight="700">nicht. </tspan>Ihr habt beide</text><text x="48" y="675" class="claude">Zusagen nach außen gegeben, ohne sie intern abzustimmen. Der Vertrieb war nur schneller beim Team.</text></g><g class="b" style="animation-delay:8.80s"><rect x="412" y="711" width="740" height="53" rx="16" fill="#ECE9DF"/><text x="432" y="747" class="du">Autsch. Was mache ich bis Freitag – konkret?</text></g><text class="denkt" x="48" y="804" style="animation-delay:9.80s"><tspan fill="#B4583A">✳</tspan> denkt nach …</text><text class="b label" x="48" y="804" style="animation-delay:11.10s">✳ CLAUDE</text><g class="b" style="animation-delay:11.10s"><text x="48" y="846" class="claude"><tspan font-weight="700">Montag: </tspan>den Export verstehen. Geh zuerst zum Vertrieb, nicht zum Management.</text></g><g class="b" style="animation-delay:12.00s"><text x="48" y="894" class="claude"><tspan font-weight="700">Bis </tspan><tspan font-weight="700">Mittwoch: </tspan>aus den Zitaten Belege machen. Zitate kannst du zählen.</text></g><g class="b" style="animation-delay:12.90s"><text x="48" y="942" class="claude"><tspan font-weight="700">Freitag: </tspan>Termin beim Management. Bitte um eine Entscheidung, statt dich zu beschweren – mit zwei oder drei</text><text x="48" y="972" class="claude">Optionen.</text></g>
  <rect x="30" y="1026" width="1140" height="44" rx="12" fill="#FFFFFF" stroke="#DEDBD0"/>
  <text x="50" y="1054" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" fill="#A8A498">Antworte Claude …</text>
</svg>
