<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-label="product-skills: Deine KI nickt alles ab. Diese nicht. Skills für Product Owner, die widersprechen. Für Claude, Gemini und ChatGPT.">
  <style>
